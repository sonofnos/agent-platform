services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: agent_platform
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://agent_platform:agent_platform@postgres:5432/agent_platform"
      VOICE_WEBHOOK_SECRET: "dev-webhook-secret"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_CHAT_MODEL: "${LLM_CHAT_MODEL:-}"
      LLM_EMBEDDING_MODEL: "${LLM_EMBEDDING_MODEL:-}"
      LLM_FALLBACK_MODELS: "${LLM_FALLBACK_MODELS:-}"
