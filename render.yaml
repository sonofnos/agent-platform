databases:
  - name: agent-platform-db
    plan: free
    databaseName: agent_platform
    user: agent_platform

services:
  - type: web
    name: agent-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-platform-db
          property: connectionString
      - key: VOICE_WEBHOOK_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_CHAT_MODEL
        sync: false
      - key: LLM_EMBEDDING_MODEL
        sync: false
