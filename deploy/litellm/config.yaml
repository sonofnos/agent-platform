# LiteLLM proxy in front of the provider. Kaira only knows the stable aliases
# below (clinic-chat, clinic-embed); which provider and model serve them, and
# what happens when one fails, is decided here, not in application code.
model_list:
  - model_name: clinic-chat
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: clinic-chat-fallback
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: clinic-embed
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  fallbacks:
    - clinic-chat: ["clinic-chat-fallback"]
  num_retries: 2
  timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
