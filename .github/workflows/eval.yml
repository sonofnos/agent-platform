name: AI evals

# On demand against a deployed instance: the suite drives the real model through
# the public API, so it needs no provider key here, and it costs real tokens, so
# it isn't run on every push.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Instance to evaluate
        default: https://kaira.sonofnos.com
      min_pass_rate:
        description: Fail below this pass rate (0-1)
        default: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run eval suite
        run: npm run eval
        env:
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/results/
